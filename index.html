<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OMNIVERSE COMICS // Metahuman Classified</title>
    <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Comic+Neue:ital,wght@0,400;0,700;1,700&family=Permanent+Marker&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="comic-masthead">
        <div class="comic-corner-box">
            <span class="cc-price">90s</span>
            <span class="cc-code">COMICS CODE AUTHORITY</span>
            <span class="cc-issue">VOL. #01</span>
        </div>

        <div class="masthead-center">
            <div class="hero-subhead">★ THE EXPANDED ACTION ARCHIVES ★</div>
            <h1 class="comic-logo">OMNIVERSE</h1>
        </div>

        <div class="mode-toggles">
            <button id="view-mode-btn" class="comic-toggle-btn">📜 SWITCH TO CONTINUOUS STRIP</button>
        </div>
    </header>

    <!-- BREADCRUMB NAVIGATION -->
    <nav id="breadcrumb-trail" class="breadcrumb-bar hidden">
        <span class="crumb" onclick="renderPublishers()">MULTIVERSE</span>
        <span id="crumb-publisher" class="crumb hidden"></span>
        <span id="crumb-faction" class="cr  umb hidden"></span>
    </nav>

    <!-- TACTICAL FILTERS (Hidden until Tier 3) -->
    <section id="tactical-filters" class="comic-nav-deck hidden">
        <div class="search-bubble">
            <input type="text" id="search-input" placeholder="🔍 QUERY CURRENT SQUAD..." autocomplete="off">
            <button id="reset-btn" class="action-btn">RESET FILTERS!</button>
        </div>

        <div class="squad-filters-container">
            <div class="filter-row">
                <button class="tab-btn active" data-key="ALL" data-val="ALL">FULL SQUAD ROSTER</button>
                <button class="tab-btn" data-key="alignment" data-val="Hero">🦸 HEROES</button>
                <button class="tab-btn" data-key="alignment" data-val="Villain">🦹 VILLAINS</button>
                <button class="tab-btn" data-key="alignment" data-val="Anti-Hero">⚡ ANTI-HEROES</button>
            </div>
        </div>
    </section>

    <div class="arcade-ticker-wrap">
        <div class="ticker-label">▶ PRO-TIP:</div>
        <div id="arcade-ticker-text" class="ticker-text">INSERT COIN TO INITIALIZE MULTIVERSE DATABANKS...</div>
    </div>

    <main class="comic-book-viewport">
        <!-- Paginator -->
        <div class="page-flipper hidden" id="page-flipper">
            <button id="prev-page" class="flip-btn">◀ PREVIOUS PAGE</button>
            <div class="page-indicator" id="page-indicator">PAGE 1 OF 1</div>
            <button id="next-page" class="flip-btn">NEXT PAGE ▶</button>
        </div>

        <!-- Render Stage -->
        <div id="comic-stage" class="comic-page-sheet">
            <div id="loading" class="narrative-box splash-load">
                SUMMONING METAHUMANS ACROSS TIME AND SPACE. . .
            </div>
        </div>
    </main>
    
    <!-- Modal -->
    <div id="detail-modal" class="modal hidden">
        <div class="modal-comic-frame">
            <button id="close-modal" class="close-comic-btn">✖ RESUME READING</button>
            <div id="modal-body"></div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
